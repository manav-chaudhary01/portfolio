<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <!-- Background Dotted Grid -->
    <pattern id="dot-grid" x="0" y="0" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#E2DDD5" />
    </pattern>
    <filter id="soft-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#1A1917" flood-opacity="0.08" />
    </filter>
    <filter id="tactile-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#1A1917" flood-opacity="0.12" />
    </filter>
  </defs>

  <!-- Warm Off-White Canvas -->
  <rect width="1200" height="630" fill="#FAF8F5" />
  <rect width="1200" height="630" fill="url(#dot-grid)" />

  <!-- Outer Border Frame -->
  <rect x="24" y="24" width="1152" height="582" rx="24" fill="none" stroke="#E5E0D8" stroke-width="2" />

  <!-- Content Container -->
  <g transform="translate(100, 100)">
    <!-- Handwritten Greeting -->
    <text x="0" y="32" font-family="'Caveat', cursive, sans-serif" font-size="34" fill="#3B82F6">
      welcome to my corner on the internet :) ✎
    </text>

    <!-- Main Title: Editorial Instrument Serif -->
    <text x="0" y="112" font-family="'Instrument Serif', Georgia, serif" font-size="76" font-weight="normal" fill="#1A1917" letter-spacing="-1">
      Manav Chaudhary
    </text>

    <!-- Role / Tagline -->
    <text x="0" y="162" font-family="'Geist', -apple-system, sans-serif" font-size="24" font-weight="normal" fill="#6B655B">
      Software Engineer &amp; Systems Builder • Clean Design &amp; Tactile Craft
    </text>

    <!-- Summary Box -->
    <rect x="0" y="210" width="680" height="110" rx="16" fill="#FFFFFF" stroke="#EBE6DF" stroke-width="1.5" filter="url(#soft-shadow)" />
    <text x="32" y="252" font-family="'Geist', -apple-system, sans-serif" font-size="18" fill="#4A453E" font-weight="normal">
      High-precision SaaS billing engines, local-first client tools,
    </text>
    <text x="32" y="284" font-family="'Geist', -apple-system, sans-serif" font-size="18" fill="#4A453E" font-weight="normal">
      and native desktop utilities where engineering rigor meets clean craft.
    </text>

    <!-- 4 Tactile Navigation Tiles (Visual Preview) -->
    <g transform="translate(0, 360)">
      <!-- Work Tile -->
      <g transform="translate(0, 0)" filter="url(#tactile-shadow)">
        <rect width="150" height="72" rx="14" fill="#FFFFFF" stroke="#E2DDD5" stroke-width="1.5" />
        <circle cx="28" cy="36" r="10" fill="#3B82F6" opacity="0.15" />
        <circle cx="28" cy="36" r="4" fill="#3B82F6" />
        <text x="48" y="42" font-family="'Geist', sans-serif" font-size="16" font-weight="600" fill="#1A1917">Work</text>
      </g>

      <!-- About Tile -->
      <g transform="translate(170, 0)" filter="url(#tactile-shadow)">
        <rect width="150" height="72" rx="14" fill="#FFFFFF" stroke="#E2DDD5" stroke-width="1.5" />
        <circle cx="28" cy="36" r="10" fill="#10B981" opacity="0.15" />
        <circle cx="28" cy="36" r="4" fill="#10B981" />
        <text x="48" y="42" font-family="'Geist', sans-serif" font-size="16" font-weight="600" fill="#1A1917">About</text>
      </g>

      <!-- Playground Tile -->
      <g transform="translate(340, 0)" filter="url(#tactile-shadow)">
        <rect width="170" height="72" rx="14" fill="#FFFFFF" stroke="#E2DDD5" stroke-width="1.5" />
        <circle cx="28" cy="36" r="10" fill="#F59E0B" opacity="0.15" />
        <circle cx="28" cy="36" r="4" fill="#F59E0B" />
        <text x="48" y="42" font-family="'Geist', sans-serif" font-size="16" font-weight="600" fill="#1A1917">Playground</text>
      </g>

      <!-- Contact Tile -->
      <g transform="translate(530, 0)" filter="url(#tactile-shadow)">
        <rect width="150" height="72" rx="14" fill="#FFFFFF" stroke="#E2DDD5" stroke-width="1.5" />
        <circle cx="28" cy="36" r="10" fill="#8B5CF6" opacity="0.15" />
        <circle cx="28" cy="36" r="4" fill="#8B5CF6" />
        <text x="48" y="42" font-family="'Geist', sans-serif" font-size="16" font-weight="600" fill="#1A1917">Contact</text>
      </g>
    </g>

    <!-- Verified Badge on Right -->
    <g transform="translate(730, 40)" filter="url(#soft-shadow)">
      <rect width="250" height="340" rx="20" fill="#FFFFFF" stroke="#E5E0D8" stroke-width="1.5" />
      <text x="24" y="44" font-family="'Geist Mono', monospace" font-size="11" font-weight="600" fill="#8C8275" letter-spacing="1">
        TELEMETRY &amp; STATUS
      </text>
      <line x1="24" y1="58" x2="226" y2="58" stroke="#EFEBE4" stroke-width="1" />

      <!-- Item 1 -->
      <circle cx="34" cy="88" r="5" fill="#10B981" />
      <text x="48" y="93" font-family="'Geist', sans-serif" font-size="14" font-weight="500" fill="#1A1917">GitHub Activity</text>
      <text x="48" y="112" font-family="'Geist Mono', monospace" font-size="12" fill="#8C8275">Verified Public Pushes</text>

      <!-- Item 2 -->
      <circle cx="34" cy="154" r="5" fill="#3B82F6" />
      <text x="48" y="159" font-family="'Geist', sans-serif" font-size="14" font-weight="500" fill="#1A1917">3 Case Studies</text>
      <text x="48" y="178" font-family="'Geist Mono', monospace" font-size="12" fill="#8C8275">MeterFlow • Attendance • Widget</text>

      <!-- Item 3 -->
      <circle cx="34" cy="220" r="5" fill="#F59E0B" />
      <text x="48" y="225" font-family="'Geist', sans-serif" font-size="14" font-weight="500" fill="#1A1917">Interactive Lab</text>
      <text x="48" y="244" font-family="'Geist Mono', monospace" font-size="12" fill="#8C8275">Springs • Audio • Magnetic</text>

      <!-- Bottom Pill -->
      <rect x="24" y="278" width="202" height="38" rx="10" fill="#F7F5F0" />
      <text x="125" y="302" font-family="'Geist Mono', monospace" font-size="12" font-weight="500" fill="#4A453E" text-anchor="middle">
        manav-chaudhary01
      </text>
    </g>
  </g>
</svg>
